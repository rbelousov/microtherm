[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microtherm"
version = "0.0.0"
description = "Microcaliber theory of thermodiffusion"
authors = [{ name = "Roman Belousov", email = "roman.belousov@embl.de" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "numpy", "scipy"
]

[project.optional-dependencies]
tests = ["pytest"]
dev = ["pytest", "pydocstringformatter", "ruff", "pyright"]
doc = ["mkdocs", "mkdocstrings[python]", "mkdocs-material"]
examples = ["matplotlib", "jupyterlab", "ipywidgets", "tqdm"]

[tool.setuptools]
packages = ["microtherm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pydocstringformatter]
max-line-length = 88
write = true

[tool.ruff]
src = ["microtherm", "tests"]
include = ["**/*.py", "**/*.ipynb"]
